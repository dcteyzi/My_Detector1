<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>تشخیص آبجکت — YOLO26</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.webgpu.min.js"></script>
<style>
  :root{
    --bg:#0b0e11;
    --panel:#14181d;
    --text:#e8e6e1;
    --muted:#8b93a1;
    --accent:#f2a93b;
    --line:#262c33;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;overflow:hidden;}
  #stage{position:fixed;inset:0;background:#000;}
  video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  #overlay{pointer-events:none;}

  #statusWrap{
    position:absolute;top:0;left:0;right:0;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;
    background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
    font-size:14px;color:var(--text);text-align:center;
  }
  #statusWrap.dim{color:var(--muted);}
  #debug{
    margin-top:6px;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:11px;color:var(--accent);direction:ltr;text-align:center;
    white-space:pre-wrap;line-height:1.5;
  }

  #panel{
    position:absolute;left:0;right:0;bottom:0;
    padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
    background:linear-gradient(to top, rgba(11,14,17,.92), rgba(11,14,17,.65) 70%, transparent);
    display:flex;flex-direction:column;gap:10px;
  }
  .row{display:flex;align-items:center;gap:10px;}
  .row label{font-size:13px;color:var(--muted);flex-shrink:0;}
  input[type=range]{flex:1;accent-color:var(--accent);}
  #thresholdVal,#fps{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;
    color:var(--accent);min-width:3.2em;text-align:left;
  }

  button{
    appearance:none;border:none;border-radius:12px;padding:14px;
    font-size:16px;font-weight:600;color:#171308;background:var(--accent);
    font-family:inherit;
  }
  button:active{opacity:.8;}
  button:disabled{background:var(--line);color:var(--muted);}

  #modelPicker{
    display:none;flex-direction:column;gap:10px;align-items:stretch;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;
  }
  #modelPicker p{margin:0;font-size:13px;color:var(--muted);line-height:1.6;}
  input[type=file]{color:var(--muted);font-size:13px;}

  #hint{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;}
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>

<div id="statusWrap">
  <div><span id="status" class="dim">در حال بارگذاری کتابخانه...</span></div>
  <div id="debug"></div>
</div>

<div id="panel">
  <div id="modelPicker">
    <p>فایل model.onnx پیدا نشد. مدل صادر‌شده‌ی خودت رو از اینجا انتخاب کن (روی گوشی از Files، یا رو دسکتاپ):</p>
    <input type="file" id="modelInput" accept=".onnx">
  </div>

  <div class="row" id="thresholdRow" style="display:none;">
    <label>آستانه اطمینان</label>
    <input type="range" id="threshold" min="0.05" max="0.95" step="0.01" value="0.25">
    <span id="thresholdVal">0.25</span>
    <span id="fps">— fps</span>
  </div>

  <button id="startBtn" style="display:none;">شروع دوربین و تشخیص</button>
  <div id="hint">دوربین پشت گوشی رو با HTTPS باز کن (نه file://) تا مرورگر اجازه بده.</div>
</div>

<script>
// ------------------------------------------------------------------
// تنظیمات — این دو مورد رو با مدل خودت هماهنگ کن
// ------------------------------------------------------------------

// ترتیب کلاس‌ها دقیقاً باید با model.names مدل خودت یکی باشه.
// تو پایتون بعد از ترین: print(list(model.names.values()))
// و همون لیست رو اینجا بریز — وگرنه به‌جاش شماره‌ی کلاس نشون داده میشه.
const CLASS_NAMES = [
  // "cola-330ml", "chips-classic", "milk-1l", ...
];

// همون imgsz که موقع export دادی (پیش‌فرض یولو 640 هست)
const MODEL_INPUT_SIZE = 640;

// خروجی خام مدلت (1×(4+تعداد کلاس)×8400) هست، نه خروجی NMS‌شده —
// یعنی خودمون باید NMS بزنیم. این دو تا رو معمولاً لازم نیست دست بزنی.
const IOU_THRESHOLD = 0.45;

// طبق درخواستت: یک فریم در ثانیه پردازش میشه تا هم گوشی داغ نکنه هم بار GPU/CPU کم بمونه.
// اگه خواستی سریع‌تر بشه، این عدد رو کم کن (مثلاً 500).
const INFER_INTERVAL_MS = 1000;

// ------------------------------------------------------------------

const videoEl = document.getElementById('video');
const canvasEl = document.getElementById('overlay');
const ctx = canvasEl.getContext('2d');
const statusEl = document.getElementById('status');
const statusWrap = document.getElementById('statusWrap');
const debugEl = document.getElementById('debug');
const thresholdRow = document.getElementById('thresholdRow');
const startBtn = document.getElementById('startBtn');
const modelPicker = document.getElementById('modelPicker');
const modelInput = document.getElementById('modelInput');
const thresholdInput = document.getElementById('threshold');
const thresholdVal = document.getElementById('thresholdVal');
const fpsEl = document.getElementById('fps');

let session = null;
let inputName = null;
let outputName = null;
let confThreshold = parseFloat(thresholdInput.value);
let running = false;

const preCanvas = document.createElement('canvas');
preCanvas.width = MODEL_INPUT_SIZE;
preCanvas.height = MODEL_INPUT_SIZE;
const preCtx = preCanvas.getContext('2d', { willReadFrequently: true });

function setStatus(msg, dim) {
  statusEl.textContent = msg;
  statusWrap.classList.toggle('dim', !!dim);
}

// --------------------------- بارگذاری مدل ---------------------------

async function loadModelFromSource(source) {
  setStatus('در حال بارگذاری مدل...');
  modelPicker.style.display = 'none';
  const hasWebGPU = !!navigator.gpu;
  try {
    session = await ort.InferenceSession.create(source, {
      executionProviders: hasWebGPU ? ['webgpu', 'wasm'] : ['wasm'],
      graphOptimizationLevel: 'all',
    });
  } catch (err) {
    setStatus('بارگذاری مدل شکست خورد: ' + err.message, true);
    return;
  }
  inputName = session.inputNames[0];
  outputName = session.outputNames[0];
  setStatus(hasWebGPU ? 'مدل آماده‌ست (WebGPU)' : 'مدل آماده‌ست (WASM — WebGPU در دسترس نبود)', true);
  startBtn.style.display = 'block';
  thresholdRow.style.display = 'flex';
}

async function tryLoadDefaultModel() {
  try {
    const res = await fetch('./model.onnx', { method: 'HEAD' });
    if (res.ok) { await loadModelFromSource('./model.onnx'); return; }
  } catch (e) { /* ignore, fall through to picker */ }
  setStatus('model.onnx کنار این صفحه پیدا نشد', true);
  modelPicker.style.display = 'flex';
}

modelInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const buf = await file.arrayBuffer();
  await loadModelFromSource(new Uint8Array(buf));
});

// --------------------------- دوربین ---------------------------

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'در حال باز کردن دوربین...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 960 }, height: { ideal: 540 } },
      audio: false,
    });
    videoEl.srcObject = stream;
    await videoEl.play();
  } catch (err) {
    setStatus('دسترسی به دوربین رد شد یا خطا داد: ' + err.message, true);
    startBtn.disabled = false;
    startBtn.textContent = 'شروع دوربین و تشخیص';
    return;
  }
  startBtn.style.display = 'none';
  setStatus('در حال تشخیص...', true);
  running = true;
  inferLoop();
});

videoEl.addEventListener('loadedmetadata', () => {
  canvasEl.width = videoEl.videoWidth;
  canvasEl.height = videoEl.videoHeight;
});
window.addEventListener('resize', () => {
  if (videoEl.videoWidth) {
    canvasEl.width = videoEl.videoWidth;
    canvasEl.height = videoEl.videoHeight;
  }
});

// --------------------------- پیش‌پردازش (letterbox) ---------------------------

function preprocess() {
  const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
  const scale = Math.min(MODEL_INPUT_SIZE / vw, MODEL_INPUT_SIZE / vh);
  const nw = Math.round(vw * scale), nh = Math.round(vh * scale);
  const padX = (MODEL_INPUT_SIZE - nw) / 2, padY = (MODEL_INPUT_SIZE - nh) / 2;

  preCtx.fillStyle = 'rgb(114,114,114)';
  preCtx.fillRect(0, 0, MODEL_INPUT_SIZE, MODEL_INPUT_SIZE);
  preCtx.drawImage(videoEl, 0, 0, vw, vh, padX, padY, nw, nh);

  const imgData = preCtx.getImageData(0, 0, MODEL_INPUT_SIZE, MODEL_INPUT_SIZE).data;
  const size = MODEL_INPUT_SIZE * MODEL_INPUT_SIZE;
  const chw = new Float32Array(3 * size);
  for (let i = 0; i < size; i++) {
    chw[i] = imgData[i * 4] / 255;
    chw[size + i] = imgData[i * 4 + 1] / 255;
    chw[2 * size + i] = imgData[i * 4 + 2] / 255;
  }
  return { chw, scale, padX, padY };
}

// --------------------------- استنتاج + رسم ---------------------------

let lastTime = performance.now();

async function inferLoop() {
  if (!running) return;
  if (videoEl.readyState < 2) { setTimeout(inferLoop, 200); return; }

  const { chw, scale, padX, padY } = preprocess();
  const inputTensor = new ort.Tensor('float32', chw, [1, 3, MODEL_INPUT_SIZE, MODEL_INPUT_SIZE]);

  let results;
  try {
    results = await session.run({ [inputName]: inputTensor });
  } catch (err) {
    setStatus('خطا در اجرای مدل: ' + err.message, true);
    running = false;
    return;
  }

  draw(results[outputName], scale, padX, padY);

  // مهم: با بک‌اند WebGPU، تنسورهای ورودی/خروجی یه بافر GPU نگه می‌دارن که
  // خودش آزاد نمیشه — بدون dispose، حافظه هر فریم بیشتر میشه تا جایی که
  // سافاری تب رو کیل و رفرش می‌کنه
  for (const name in results) {
    if (typeof results[name].dispose === 'function') results[name].dispose();
  }
  if (typeof inputTensor.dispose === 'function') inputTensor.dispose();

  const now = performance.now();
  fpsEl.textContent = (1000 / (now - lastTime)).toFixed(2) + ' fps';
  lastTime = now;

  // به‌جای requestAnimationFrame (که هر ریفرش صفحه صدا زده میشه، ده‌ها بار در ثانیه)،
  // با تاخیر ثابت صدا می‌زنیم تا دقیقاً هر ۱ ثانیه یک بار محاسبه انجام بشه
  setTimeout(inferLoop, INFER_INTERVAL_MS);
}

function classColor(id) {
  return `hsl(${(id * 47) % 360}, 85%, 55%)`;
}

// IoU دو باکس [x1,y1,x2,y2]
function iou(a, b) {
  const x1 = Math.max(a.x1, b.x1), y1 = Math.max(a.y1, b.y1);
  const x2 = Math.min(a.x2, b.x2), y2 = Math.min(a.y2, b.y2);
  const interW = Math.max(0, x2 - x1), interH = Math.max(0, y2 - y1);
  const inter = interW * interH;
  const areaA = Math.max(0, a.x2 - a.x1) * Math.max(0, a.y2 - a.y1);
  const areaB = Math.max(0, b.x2 - b.x1) * Math.max(0, b.y2 - b.y1);
  return inter / (areaA + areaB - inter + 1e-6);
}

// خروجی خام یولو به‌صورت (1, 4+nc, N) هست: N لنگر (anchor)، و برای هر لنگر
// ۴ مقدار باکس (cx,cy,w,h) بعد nc امتیاز کلاس — چیدمانش کانال-محور هست، یعنی
// همه‌ی N مقدار کانال ۰ اول میان، بعد همه‌ی N مقدار کانال ۱، و... (نه به‌صورت
// پشت‌سرهم برای هر باکس). این تابع argmax کلاس‌ها + آستانه + NMS رو خودش انجام میده.
function decode(output, confThresh) {
  const data = output.data;
  const C = output.dims[1];
  const N = output.dims[2];
  const nc = C - 4;

  const candidates = [];
  for (let a = 0; a < N; a++) {
    let bestScore = -Infinity, bestClass = -1;
    for (let c = 0; c < nc; c++) {
      const s = data[(4 + c) * N + a];
      if (s > bestScore) { bestScore = s; bestClass = c; }
    }
    if (bestScore < confThresh) continue;
    const cx = data[a], cy = data[N + a], w = data[2 * N + a], h = data[3 * N + a];
    candidates.push({
      x1: cx - w / 2, y1: cy - h / 2, x2: cx + w / 2, y2: cy + h / 2,
      score: bestScore, classId: bestClass,
    });
  }

  candidates.sort((a, b) => b.score - a.score);
  const kept = [];
  const suppressed = new Array(candidates.length).fill(false);
  for (let i = 0; i < candidates.length; i++) {
    if (suppressed[i]) continue;
    kept.push(candidates[i]);
    for (let j = i + 1; j < candidates.length; j++) {
      if (!suppressed[j] && candidates[j].classId === candidates[i].classId &&
          iou(candidates[i], candidates[j]) > IOU_THRESHOLD) {
        suppressed[j] = true;
      }
    }
  }
  return kept;
}

function draw(output, scale, padX, padY) {
  ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
  const data = output.data;
  const C = output.dims[1];
  const N = output.dims[2];
  const nc = C - 4;

  ctx.lineWidth = Math.max(2, canvasEl.width / 400);
  ctx.font = `${Math.max(14, canvasEl.width / 60)}px -apple-system, sans-serif`;
  ctx.textBaseline = 'top';

  // دیباگ: بدون توجه به آستانه، بهترین امتیاز خامی که مدل این فریم به هر لنگر داده
  // (بعداً که همه‌چی درست شد، این خط قابل حذفه)
  let dbgBest = -Infinity, dbgClass = -1;
  for (let a = 0; a < N; a++) {
    for (let c = 0; c < nc; c++) {
      const s = data[(4 + c) * N + a];
      if (s > dbgBest) { dbgBest = s; dbgClass = c; }
    }
  }
  debugEl.textContent = `out: ${output.dims.join('x')} (nc=${nc})  بهترین امتیاز خام=${dbgBest.toFixed(3)} کلاس=${dbgClass}`;

  const dets = decode(output, confThreshold);
  for (const det of dets) {
    const x1 = (det.x1 - padX) / scale;
    const y1 = (det.y1 - padY) / scale;
    const x2 = (det.x2 - padX) / scale;
    const y2 = (det.y2 - padY) / scale;

    const color = classColor(det.classId);
    ctx.strokeStyle = color;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

    const label = `${CLASS_NAMES[det.classId] || 'class ' + det.classId} ${(det.score * 100).toFixed(0)}%`;
    const th = Math.max(18, canvasEl.width / 45);
    const tw = ctx.measureText(label).width + 10;
    const ty = Math.max(0, y1 - th);
    ctx.fillStyle = color;
    ctx.fillRect(x1, ty, tw, th);
    ctx.fillStyle = '#0b0e11';
    ctx.fillText(label, x1 + 5, ty + th * 0.15);
  }
}

thresholdInput.addEventListener('input', (e) => {
  confThreshold = parseFloat(e.target.value);
  thresholdVal.textContent = confThreshold.toFixed(2);
});

// --------------------------- شروع ---------------------------

window.addEventListener('load', () => {
  if (typeof ort === 'undefined') {
    setStatus('کتابخانه‌ی onnxruntime-web لود نشد — اتصال اینترنت رو چک کن.', true);
    return;
  }
  tryLoadDefaultModel();
});
</script>
</body>
</html>
